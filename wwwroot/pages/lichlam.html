<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch làm việc - Siêu Thị Mini</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/app.css">
</head>
<body>
    <div class="app-wrapper">
        <aside class="sidebar p-3">
            <div class="brand mb-4">
                Siêu Thị Mini
                <small>Management Dashboard</small>
            </div>

            <ul class="nav flex-column">
                <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" href="pos.html">Bán hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="tonkho.html">Tồn kho</a></li>
                <li class="nav-item"><a class="nav-link active" href="nhanvien.html">Nhân viên</a></li>
                <li class="nav-item"><a class="nav-link" href="khachhang.html">Khách hàng</a></li>
                <li class="nav-item"><a class="nav-link" href="nhacc.html">Nhà cung cấp</a></li>
                <li class="nav-item"><a class="nav-link" href="canhbao.html">Cảnh báo</a></li>
                <li class="nav-item mt-2"><a class="nav-link text-danger" href="#" onclick="logout()">Đăng xuất</a></li>
            </ul>
        </aside>

        <div class="main-content">
            <header class="topbar d-flex justify-content-between align-items-center">
                <div>
                    <h5>Quản lý lịch làm việc</h5>
                    <div class="text-muted small">Chọn nhân viên và thêm ca làm</div>
                </div>
                <div class="user-chip">
                    <div class="avatar" id="userAvatar">K</div>
                    <div>
                        <div class="small text-muted">Xin chào</div>
                        <div class="fw-semibold" id="staffName">Nhân viên</div>
                    </div>
                </div>
            </header>

            <main class="page-content">
                <div class="card-ui p-4 mb-4">
                    <div class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label">Chọn nhân viên</label>
                            <select class="form-select" id="employeeSelect">
                                <option value="">-- Chọn nhân viên --</option>
                            </select>
                        </div>

                        <div class="col-md-3">
                            <button class="btn btn-primary w-100" onclick="loadSchedule()">Xem lịch làm</button>
                        </div>
                    </div>
                </div>

                <div class="card-ui p-4 mb-4">
                    <h5 class="mb-3">Thêm ca làm</h5>
                    <form id="scheduleForm" class="row g-3">
                        <div class="col-md-4">
                            <label class="form-label">Ngày làm</label>
                            <input type="date" class="form-control" id="workDate" required>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">Ca làm</label>
                            <select class="form-select" id="shift" required>
                                <option value="Sáng">Sáng</option>
                                <option value="Chiều">Chiều</option>
                                <option value="Tối">Tối</option>
                            </select>
                        </div>

                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-primary w-100">Lưu ca làm</button>
                        </div>
                    </form>
                </div>

                <div class="table-responsive table-modern">
                    <table class="table table-hover align-middle mb-0">
                        <thead>
                            <tr>
                                <th>Ngày</th>
                                <th>Ca</th>
                                <th>Trạng thái</th>
                            </tr>
                        </thead>
                        <tbody id="scheduleTableBody">
                            <tr><td colspan="3" class="text-center py-4 text-muted">Chưa chọn nhân viên</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script src="assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lichlam.js"></script>
</body>
</html>
