<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Siêu Thị Mini</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        :root {
            --primary: #dc2626;
            --primary-dark: #b91c1c;
            --bg1: #fff1f2;
            --bg2: #ffffff;
            --text: #111827;
            --muted: #6b7280;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: radial-gradient(circle at top left, rgba(220, 38, 38, 0.18), transparent 30%), radial-gradient(circle at bottom right, rgba(239, 68, 68, 0.12), transparent 28%), linear-gradient(135deg, var(--bg1), var(--bg2));
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .bg-shape {
            position: absolute;
            border-radius: 50%;
            filter: blur(10px);
            opacity: .35;
            pointer-events: none;
        }

        .shape-1 {
            width: 220px;
            height: 220px;
            background: #fca5a5;
            top: -40px;
            left: -40px;
        }

        .shape-2 {
            width: 280px;
            height: 280px;
            background: #fecaca;
            bottom: -80px;
            right: -80px;
        }

        .login-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 430px;
            padding: 24px;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.55);
            border-radius: 28px;
            box-shadow: 0 24px 70px rgba(0, 0, 0, 0.12);
            padding: 34px 32px 30px;
        }

        .brand-badge {
            width: 72px;
            height: 72px;
            border-radius: 22px;
            background: linear-gradient(135deg, var(--primary), #ef4444);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 18px;
            color: #fff;
            font-size: 34px;
            box-shadow: 0 12px 28px rgba(220, 38, 38, 0.3);
        }

        .app-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
            margin-bottom: 6px;
            letter-spacing: -0.5px;
        }

        .app-subtitle {
            text-align: center;
            color: var(--muted);
            font-size: 0.98rem;
            margin-bottom: 26px;
        }

        .form-label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #1f2937;
        }

        .form-control {
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            padding: 12px 14px;
            font-size: 0.98rem;
            transition: all .2s ease;
            background: rgba(255,255,255,0.95);
        }

            .form-control:focus {
                border-color: var(--primary);
                box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.14);
            }

        .btn-login {
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 13px 16px;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            background: linear-gradient(135deg, var(--primary), #ef4444);
            box-shadow: 0 14px 26px rgba(220, 38, 38, 0.25);
            transition: all .2s ease;
        }

            .btn-login:hover {
                transform: translateY(-1px);
                box-shadow: 0 18px 30px rgba(220, 38, 38, 0.3);
            }

            .btn-login:active {
                transform: translateY(0);
            }

        .hint {
            text-align: center;
            color: var(--muted);
            font-size: 0.9rem;
            margin-top: 16px;
        }

        .alert {
            border-radius: 14px;
        }

        @media (max-width: 576px) {
            .login-wrapper {
                padding: 16px;
            }

            .login-card {
                padding: 28px 22px;
                border-radius: 22px;
            }

            .app-title {
                font-size: 1.7rem;
            }
        }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="brand-badge">🛒</div>
            <div class="app-title">Siêu Thị Mini</div>
            <div class="app-subtitle">Đăng nhập hệ thống quản lý</div>

            <div id="loginAlert" class="alert alert-danger d-none" role="alert"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label for="username" class="form-label">Tên đăng nhập</label>
                    <input type="text" id="username" class="form-control" placeholder="Nhập username..." required />
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label">Mật khẩu</label>
                    <input type="password" id="password" class="form-control" placeholder="Nhập mật khẩu..." required />
                </div>

                <button type="submit" class="btn-login">Đăng nhập</button>
            </form>

            <div class="hint">Hệ thống quản lý bán hàng siêu thị mini</div>
        </div>
    </div>

    <script src="login.js"></script>
</body>
</html>
